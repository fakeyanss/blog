name: deploying Hexo pages

on:
  push:
    branches:
      - source

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: deploy blog.
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: source
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - name: Install dependencies
      run: |
        npm install
        npm install hexo-cli -g
    - name: Build page
      run: |
        hexo clean
        hexo generate
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        # Use the workflow's built-in token instead of a personal access token
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # Git branch where site will be deployed
        publish_branch: master
        # Build directory to deploy
        publish_dir: ./public
